name: exam-prep-v4-avalai-ocr-live-smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type I_APPROVE_8_PRIVATE_OCR_REQUESTS'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: exam-prep-v4-avalai-ocr-live-smoke
  cancel-in-progress: false

jobs:
  live-ocr-smoke:
    name: bounded two-page AvalAI OCR live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
      PRIVATE_DIR: /tmp/exam-prep-v4-ocr-smoke
      REPORT_PATH: /tmp/exam-prep-v4-ocr-smoke/aggregate-report.json
      SOURCE_PDF_REPO_PATH: 'دفترچه اول (زیست).pdf'
      EXPECTED_PAGE_COUNT: '16'
      QUESTION_PAGE_NUMBER: '5'
      ANSWER_PAGE_NUMBER: '12'

    steps:
      - name: Enforce branch and explicit authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feat/exam-prep-v4-source-aware"
          test "${{ inputs.confirmation }}" = "I_APPROVE_8_PRIVATE_OCR_REQUESTS"

      - name: Validate required secret without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AVALAI_API_KEY:-}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Extract exactly two private page images from main fixture
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${PRIVATE_DIR}"
          git fetch --no-tags --depth=1 origin main
          git show "origin/main:${SOURCE_PDF_REPO_PATH}" > "${PRIVATE_DIR}/source.pdf"
          python - <<'PY'
          import os
          from pathlib import Path
          import pypdfium2 as pdfium

          private_dir = Path(os.environ['PRIVATE_DIR'])
          source_path = private_dir / 'source.pdf'
          if source_path.stat().st_size < 5 or source_path.read_bytes()[:5] != b'%PDF-':
              raise SystemExit('source fixture is not a PDF')

          expected_page_count = int(os.environ['EXPECTED_PAGE_COUNT'])
          selected = (
              ('question-page', int(os.environ['QUESTION_PAGE_NUMBER'])),
              ('answer-page', int(os.environ['ANSWER_PAGE_NUMBER'])),
          )
          document = pdfium.PdfDocument(str(source_path))
          try:
              if len(document) != expected_page_count:
                  raise SystemExit('source fixture page count mismatch')
              rendered_paths = []
              for label, page_number in selected:
                  if not 1 <= page_number <= len(document):
                      raise SystemExit('selected source page is out of range')
                  page = document[page_number - 1]
                  try:
                      image = page.render(scale=2.0).to_pil().convert('RGB')
                  finally:
                      page.close()
                  image.thumbnail((1800, 2400))
                  output_path = private_dir / f'{label}.png'
                  image.save(output_path, format='PNG', optimize=True)
                  if output_path.stat().st_size < 1:
                      raise SystemExit('rendered page is empty')
                  if output_path.stat().st_size > 12 * 1024 * 1024:
                      raise SystemExit('rendered page exceeds byte limit')
                  rendered_paths.append(output_path)
              if rendered_paths[0].read_bytes() == rendered_paths[1].read_bytes():
                  raise SystemExit('selected smoke pages must be different images')
              (private_dir / 'question-path.txt').write_text(
                  str(rendered_paths[0]), encoding='utf-8'
              )
              (private_dir / 'answer-path.txt').write_text(
                  str(rendered_paths[1]), encoding='utf-8'
              )
          finally:
              document.close()
          PY
          shred -u "${PRIVATE_DIR}/source.pdf"

      - name: Run bounded aggregate-only live OCR smoke
        shell: bash
        run: |
          set -euo pipefail
          QUESTION_PATH="$(cat "${PRIVATE_DIR}/question-path.txt")"
          ANSWER_PATH="$(cat "${PRIVATE_DIR}/answer-path.txt")"
          python backend/manage.py smoke_exam_prep_v4_avalai_ocr \
            --question-page "${QUESTION_PATH}" \
            --answer-page "${ANSWER_PATH}" \
            --report "${REPORT_PATH}" \
            --mode live_provider \
            --model mistral-ocr-4-0 \
            --smoke-modes markdown,blocks,document_annotation,bbox_annotation \
            --max-requests 8 \
            --allow-private-transmission

      - name: Validate aggregate report contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['REPORT_PATH']).read_text(encoding='utf-8'))
          assert report['model'] == 'mistral-ocr-4-0'
          assert report['plannedRequestCount'] == 8
          assert report['executedRequestCount'] == 8
          assert report['maxRequests'] == 8
          assert report['acceptance']['passed'] is True
          assert len(report['results']) == 8
          PY

      - name: Upload aggregate-only report
        uses: actions/upload-artifact@v4
        with:
          name: exam-prep-v4-avalai-ocr-aggregate
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Delete private fixture, page images, and local report
        if: always()
        shell: bash
        run: |
          set +e
          find "${PRIVATE_DIR}" -type f -exec shred -u {} \; 2>/dev/null
          rm -rf "${PRIVATE_DIR}"
