name: apply-source-map-rendering-hotfix

on:
  push:
    branches:
      - hotfix/exam-prep-source-map-rendering

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/exam-prep-source-map-rendering
          fetch-depth: 0

      - name: Apply reviewed hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          tracker_path = Path('frontend/src/components/teacher/create-class/pipeline-tracker.tsx')
          tracker = tracker_path.read_text(encoding='utf-8')
          tracker = replace_once(
              tracker,
              "import { ExamPrepSourceAwareWorkspace } from './exam-prep-source-aware-workspace';\n",
              '',
              'tracker workspace import',
          )
          tracker = replace_once(
              tracker,
              """\n      {pipelineType === 'exam_prep' && sessionId ? (\n        <ExamPrepSourceAwareWorkspace sessionId={sessionId} />\n      ) : null}\n""",
              '\n',
              'tracker duplicate workspace render',
          )
          tracker_path.write_text(tracker, encoding='utf-8')

          workspace_path = Path('frontend/src/components/teacher/create-class/exam-prep-source-aware-workspace.tsx')
          workspace = workspace_path.read_text(encoding='utf-8')
          workspace = replace_once(
              workspace,
              """  const hasSourceMap = project.documents.some((document) => document.hasSourceMap);\n  const shouldShowEditor = hasSourceMap || !['draft', 'uploading', 'classifying'].includes(project.status);""",
              """  const allDocumentsClassified = project.documents.length > 0 && project.documents.every(\n    (document) => document.hasClassification\n      && document.hasSourceMap\n      && !['pending_upload', 'uploaded', 'rendering', 'classifying'].includes(document.status),\n  );\n  const sourcePreparationFailed = project.status === 'failed' && !allDocumentsClassified;\n  const shouldShowEditor = allDocumentsClassified\n    && !['draft', 'uploading', 'classifying'].includes(project.status);""",
              'workspace readiness gate',
          )
          workspace = replace_once(
              workspace,
              """      {!shouldShowEditor ? (\n        <Card className=\"rounded-2xl border-border/60\">\n          <CardContent className=\"flex items-center gap-3 p-4 text-sm text-muted-foreground\">\n            <Loader2 className=\"h-4 w-4 animate-spin\" aria-hidden=\"true\" />\n            در حال تشخیص ساختار و نقش صفحات…\n          </CardContent>\n        </Card>\n      ) : (\n        <div className=\"[&_a]:hidden\">\n          <ExamPrepV4SourceMapEditor projectId={projectId} />\n        </div>\n      )}""",
              """      {sourcePreparationFailed ? (\n        <Alert variant=\"destructive\" className=\"rounded-2xl\">\n          <TriangleAlert className=\"h-4 w-4\" aria-hidden=\"true\" />\n          <AlertTitle>تشخیص نقش صفحات کامل نشد</AlertTitle>\n          <AlertDescription>\n            پردازش اولیهٔ PDF متوقف شده است. یک پیش‌نویس جدید بسازید و فایل را دوباره ارسال کنید.\n          </AlertDescription>\n        </Alert>\n      ) : !shouldShowEditor ? (\n        <Card className=\"rounded-2xl border-border/60\">\n          <CardContent className=\"flex items-center gap-3 p-4 text-sm text-muted-foreground\">\n            <Loader2 className=\"h-4 w-4 animate-spin\" aria-hidden=\"true\" />\n            در حال تشخیص ساختار و نقش صفحات…\n          </CardContent>\n        </Card>\n      ) : (\n        <div className=\"[&_a]:hidden\">\n          <ExamPrepV4SourceMapEditor projectId={projectId} />\n        </div>\n      )}""",
              'workspace editor rendering gate',
          )
          workspace_path.write_text(workspace, encoding='utf-8')

          source_map_path = Path('backend/apps/classes/services/exam_prep_v4_source_map.py')
          source_map = source_map_path.read_text(encoding='utf-8')
          source_map = replace_once(
              source_map,
              """def _safe_source_map_fingerprint(\n    *,\n    document: ExamSourceDocument,\n    pages: list[ExamSourcePage],\n) -> str | None:\n    if document.source_map_fingerprint:""",
              """def _safe_source_map_fingerprint(\n    *,\n    document: ExamSourceDocument,\n    pages: list[ExamSourcePage],\n) -> str | None:\n    # Rendered page rows exist before the multimodal classifier has completed.\n    # Do not advertise those default UNKNOWN rows as a usable Source Map.\n    if not document.classification_fingerprint:\n        return None\n    if document.source_map_fingerprint:""",
              'backend classification contract gate',
          )
          source_map_path.write_text(source_map, encoding='utf-8')

          test_path = Path('backend/apps/classes/test_exam_prep_v4_source_map_api.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_nonexistent_project_returns_404(settings):\n'
          if marker not in tests:
              raise SystemExit('source map test insertion marker missing')
          test = '''def test_rendered_unknown_pages_are_not_exposed_as_source_map_before_classification(settings):\n    settings.EXAM_PREP_V4_ENABLED = True\n    teacher = _user()\n    project = _project(teacher, status=ExamProject.Status.CLASSIFYING)\n    document = ExamSourceDocument.objects.create(\n        project=project,\n        original_name='private.pdf',\n        page_count=2,\n        status=ExamSourceDocument.Status.CLASSIFYING,\n        classification_fingerprint='',\n    )\n    for page_number in (1, 2):\n        ExamSourcePage.objects.create(\n            document=document,\n            page_number=page_number,\n            display_order=page_number,\n            predicted_role=ExamSourceRole.UNKNOWN,\n            predicted_confidence=Decimal('0.0000'),\n        )\n\n    response = _client(teacher).get(_detail_url(project.id))\n\n    assert response.status_code == 200\n    source = response.data['documents'][0]\n    assert source['hasClassification'] is False\n    assert source['hasSourceMap'] is False\n    assert source['sourceMapFingerprint'] is None\n    assert len(source['pages']) == 2\n\n\n'''
          tests = tests.replace(marker, test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/apply-source-map-rendering-hotfix.yml').unlink()
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(exam-prep): render classified source map once"
          git push origin HEAD:hotfix/exam-prep-source-map-rendering
