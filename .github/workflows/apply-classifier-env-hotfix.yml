name: apply-classifier-env-hotfix

on:
  push:
    branches:
      - hotfix/exam-prep-source-map-rendering

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/exam-prep-source-map-rendering
          fetch-depth: 0

      - name: Apply classifier model selection fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          classifier_path = Path('backend/apps/classes/services/exam_prep_v4_fast_classifier.py')
          classifier = classifier_path.read_text(encoding='utf-8')
          classifier = replace_once(
              classifier,
              """        or (os.getenv('EXAM_PREP_V4_CLASSIFICATION_MODEL') or '').strip()\n        or (os.getenv('PDF_VISION_MODEL') or '').strip()\n    )""",
              """        or (os.getenv('EXAM_PREP_V4_CLASSIFICATION_MODEL') or '').strip()\n        or (os.getenv('PDF_VISION_MODEL') or '').strip()\n        or (os.getenv('MODEL_NAME') or '').strip()\n    )""",
              'classifier model fallback chain',
          )
          classifier = replace_once(
              classifier,
              "'Set EXAM_PREP_V4_CLASSIFICATION_MODEL or PDF_VISION_MODEL.'",
              "'Set EXAM_PREP_V4_CLASSIFICATION_MODEL, PDF_VISION_MODEL, or MODEL_NAME.'",
              'classifier config error text',
          )
          classifier_path.write_text(classifier, encoding='utf-8')

          tests_path = Path('backend/apps/classes/test_exam_prep_v4_fast_classifier.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              """    monkeypatch.delenv('EXAM_PREP_V4_CLASSIFICATION_MODEL', raising=False)\n    monkeypatch.delenv('PDF_VISION_MODEL', raising=False)\n\n    with pytest.raises(FastClassifierConfigurationError):""",
              """    monkeypatch.delenv('EXAM_PREP_V4_CLASSIFICATION_MODEL', raising=False)\n    monkeypatch.delenv('PDF_VISION_MODEL', raising=False)\n    monkeypatch.delenv('MODEL_NAME', raising=False)\n\n    with pytest.raises(FastClassifierConfigurationError):""",
              'classifier missing env test',
          )
          marker = 'def test_fast_classifier_requires_complete_non_overlapping_sheet_coverage():\n'
          if marker not in tests:
              raise SystemExit('classifier test insertion marker missing')
          fallback_test = '''def test_fast_classifier_falls_back_to_generic_model_env(monkeypatch):\n    monkeypatch.delenv('EXAM_PREP_V4_CLASSIFICATION_MODEL', raising=False)\n    monkeypatch.delenv('PDF_VISION_MODEL', raising=False)\n    monkeypatch.setenv('MODEL_NAME', 'models/generic-multimodal-model')\n\n    assert fast._select_model() == 'generic-multimodal-model'\n\n\n'''
          tests = tests.replace(marker, fallback_test + marker, 1)
          tests_path.write_text(tests, encoding='utf-8')

          env_path = Path('backend/.env.production.example')
          env_text = env_path.read_text(encoding='utf-8')
          env_text = replace_once(
              env_text,
              """# Models are selected only from environment. No hidden model fallback is added.\nEXAM_PREP_V4_BLOCK_MODEL=gemini-2.5-flash""",
              """# Models are selected only from environment. No hidden model fallback is added.\n# Page-role classification falls back to PDF_VISION_MODEL, then MODEL_NAME.\nEXAM_PREP_V4_CLASSIFICATION_MODEL=gemini-2.5-flash\nEXAM_PREP_V4_BLOCK_MODEL=gemini-2.5-flash""",
              'production classifier env example',
          )
          env_path.write_text(env_text, encoding='utf-8')

          Path('.github/workflows/apply-classifier-env-hotfix.yml').unlink()
          PY

      - name: Commit classifier fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(exam-prep): use configured generic model for page classification"
          git push origin HEAD:hotfix/exam-prep-source-map-rendering
