name: exam-prep-v4

on:
  pull_request:
    paths:
      - '.github/workflows/exam-prep-v4.yml'
      - '.github/workflows/exam-prep-v4-avalai-ocr-live-smoke.yml'
      - 'backend/apps/classes/apps.py'
      - 'backend/apps/classes/models_v4*.py'
      - 'backend/apps/classes/signals.py'
      - 'backend/apps/classes/tasks_v4*.py'
      - 'backend/apps/classes/views_v4*.py'
      - 'backend/apps/classes/serializers_v4*.py'
      - 'backend/apps/classes/urls_v4.py'
      - 'backend/apps/classes/management/commands/*exam_prep_v4*.py'
      - 'backend/apps/classes/migrations/004*_exam_prep_v4_*.py'
      - 'backend/apps/classes/services/exam_prep_v4_*.py'
      - 'backend/apps/classes/test_exam_prep_v4_*.py'
      - 'backend/apps/commons/llm_prompts/__init__.py'
      - 'backend/apps/commons/llm_prompts/exam_prep_v4.py'
      - 'backend/core/storage_backends.py'
      - 'backend/core/urls.py'
      - 'backend/.env.production.example'
      - 'frontend/tsconfig.exam-prep-v4.json'
      - 'frontend/src/features/exam-prep-v4/**'
      - 'frontend/src/services/exam-prep-v4*.ts'
      - 'frontend/src/services/exam-prep-source-aware-service.ts'
      - 'frontend/src/hooks/use-exam-prep-v4-*.ts'
      - 'frontend/src/components/teacher/exam-prep-v4/**'
      - 'frontend/src/components/teacher/create-class/exam-prep-source-aware-workspace.tsx'
      - 'frontend/src/components/teacher/create-class/pipeline-tracker.tsx'
      - 'frontend/src/components/teacher/create-class/file-upload-section.tsx'
      - 'frontend/src/app/(teacher)/teacher/exam-prep-v4/**'
      - 'frontend/src/constants/navigation.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'docs/features/exam-prep-v4-*.md'
      - 'docs/runbooks/exam-prep-v4-*.md'
  workflow_dispatch:

jobs:
  finalize-hotfix:
    name: finalize stuck-start hotfix
    if: github.head_ref == 'hotfix/exam-prep-stuck-start' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/exam-prep-stuck-start
          fetch-depth: 0

      - name: Patch reviewed edge case and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/teacher/create-class/create-class-page.tsx')
          text = path.read_text(encoding='utf-8')

          old_cancel = """  // The initial request is abortable even before the server returns a session id.
          const canCancelPipeline = currentIsPipelineStarting
            || (currentIsPipelineRunning && Boolean(currentSessionId));"""
          new_cancel = """  // Exam-prep intake is abortable before the server returns a session id.
          const canCancelPipeline = (
            pipelineType === 'exam_prep' && isExamPrepPipelineStarting
          ) || (currentIsPipelineRunning && Boolean(currentSessionId));"""
          if text.count(old_cancel) != 1:
              raise SystemExit(f'cancel block count={text.count(old_cancel)}')
          text = text.replace(old_cancel, new_cancel, 1)

          old_options = """          {
          onProgress: (p) => setUploadProgress(p),
          signal: startController.signal,
          processingTimeoutMs: 180_000,
        },"""
          new_options = """          {
            onProgress: (p) => setUploadProgress(p),
            signal: startController.signal,
            processingTimeoutMs: 180_000,
          },"""
          if text.count(old_options) != 1:
              raise SystemExit(f'options block count={text.count(old_options)}')
          text = text.replace(old_options, new_options, 1)
          path.write_text(text, encoding='utf-8')

          for temporary in (
              Path('.github/workflows/apply-exam-prep-stuck-hotfix-pr.yml'),
              Path('.github/workflows/finalize-exam-prep-stuck-hotfix.yml'),
          ):
              temporary.unlink(missing_ok=True)
          PY

          git checkout origin/main -- .github/workflows/exam-prep-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(exam-prep): scope pre-session cancellation correctly"
          git push origin HEAD:hotfix/exam-prep-stuck-start

  backend:
    name: v4 backend validation (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_amooz
          POSTGRES_USER: ai_amooz
          POSTGRES_PASSWORD: ai_amooz_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_amooz -d ai_amooz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ai_amooz:ai_amooz_password@localhost:5432/ai_amooz
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-insecure-v4-test-key
      DEBUG: 'True'
      EXAM_PREP_V4_ENABLED: 'True'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django system check
        run: python backend/manage.py check

      - name: Check classes migration drift
        run: python backend/manage.py makemigrations classes --check --dry-run

      - name: Run all V4 tests on PostgreSQL
        run: |
          python -m pytest \
            backend/apps/classes/test_exam_prep_v4_*.py \
            -q --create-db

  frontend:
    name: v4 teacher-flow frontend validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Focused TypeScript check
        working-directory: frontend
        run: npx tsc -p tsconfig.exam-prep-v4.json --noEmit

      - name: Source-map state model tests
        working-directory: frontend
        run: >-
          node --experimental-strip-types --test
          src/features/exam-prep-v4/source-map-model.test.ts
