name: exam-prep-v4

on:
  pull_request:
    paths:
      - '.github/workflows/exam-prep-v4.yml'
      - '.github/workflows/exam-prep-v4-avalai-ocr-live-smoke.yml'
      - 'backend/apps/classes/apps.py'
      - 'backend/apps/classes/models_v4.py'
      - 'backend/apps/classes/signals.py'
      - 'backend/apps/classes/tasks_v4.py'
      - 'backend/apps/classes/views_v4.py'
      - 'backend/apps/classes/views_v4_source_map.py'
      - 'backend/apps/classes/serializers_v4.py'
      - 'backend/apps/classes/urls_v4.py'
      - 'backend/apps/classes/management/commands/benchmark_exam_prep_v4.py'
      - 'backend/apps/classes/migrations/004*_exam_prep_v4_*.py'
      - 'backend/apps/classes/services/exam_prep_v4_*.py'
      - 'backend/apps/classes/test_exam_prep_v4_*.py'
      - 'backend/apps/commons/llm_prompts/__init__.py'
      - 'backend/apps/commons/llm_prompts/exam_prep_v4.py'
      - 'backend/core/storage_backends.py'
      - 'backend/core/urls.py'
      - 'frontend/tsconfig.exam-prep-v4.json'
      - 'frontend/src/features/exam-prep-v4/**'
      - 'frontend/src/services/exam-prep-v4-service.ts'
      - 'frontend/src/hooks/use-exam-prep-v4-*.ts'
      - 'frontend/src/components/teacher/exam-prep-v4/**'
      - 'frontend/src/app/(teacher)/teacher/exam-prep-v4/**'
      - 'frontend/src/constants/navigation.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'docs/features/exam-prep-v4-*.md'
      - 'docs/runbooks/exam-prep-v4-*.md'
  workflow_dispatch:

jobs:
  backend:
    name: v4 backend validation (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_amooz
          POSTGRES_USER: ai_amooz
          POSTGRES_PASSWORD: ai_amooz_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_amooz -d ai_amooz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ai_amooz:ai_amooz_password@localhost:5432/ai_amooz
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-insecure-v4-test-key
      DEBUG: 'True'
      EXAM_PREP_V4_ENABLED: 'True'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django system check
        run: python backend/manage.py check

      - name: Check classes migration drift
        run: python backend/manage.py makemigrations classes --check --dry-run

      - name: Run all V4 tests on PostgreSQL
        run: |
          python -m pytest \
            backend/apps/classes/test_exam_prep_v4_*.py \
            -q --create-db

  frontend:
    name: v4 source-map frontend validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Focused TypeScript check
        working-directory: frontend
        run: npx tsc -p tsconfig.exam-prep-v4.json --noEmit

      - name: Source-map state model tests
        working-directory: frontend
        run: >-
          node --experimental-strip-types --test
          src/features/exam-prep-v4/source-map-model.test.ts
