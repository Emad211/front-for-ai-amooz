name: exam-prep-production

on:
  pull_request:
    paths:
      - '.github/workflows/exam-prep-v4.yml'
      - 'backend/apps/classes/**'
      - 'backend/apps/chatbot/**'
      - 'backend/apps/commons/**'
      - 'backend/core/settings.py'
      - 'backend/requirements.txt'
      - 'backend/pytest.ini'
      - 'backend/core/urls.py'
      - 'backend/core/storage_backends.py'
      - 'backend/.env.example'
      - 'backend/.env.production.example'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

jobs:
  backend:
    name: exam prep backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_amooz
          POSTGRES_USER: ai_amooz
          POSTGRES_PASSWORD: ai_amooz_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_amooz -d ai_amooz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ai_amooz:ai_amooz_password@localhost:5432/ai_amooz
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-insecure-exam-prep-test-key
      DEBUG: 'True'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Migration drift
        run: python manage.py makemigrations classes --check --dry-run

      - name: Production Exam Prep tests
        run: |
          python -m pytest apps/classes \
            -k "exam_prep_mistral or exam_prep_api_state_boundaries or exam_prep_inline_visual or student_exam_prep_result_api or pipeline_cancel or pipeline_robustness" \
            -q --create-db

  frontend:
    name: exam prep frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build
