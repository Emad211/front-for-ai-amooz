name: exam-prep-v4-avalai-ocr-one-shot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-prep-v4-avalai-ocr-one-shot
  cancel-in-progress: false

jobs:
  live-ocr-smoke:
    name: two-page AvalAI OCR evidence run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
      PRIVATE_DIR: /tmp/exam-prep-v4-ocr-smoke
      REPORT_PATH: /tmp/exam-prep-v4-ocr-smoke/aggregate-report.json
      SOURCE_PDF_PATH: ${{ github.workspace }}/fixtures/دفترچه اول (زیست).pdf
      EXPECTED_PAGE_COUNT: '16'
      QUESTION_PAGE_NUMBER: '5'
      ANSWER_PAGE_NUMBER: '12'
      OCR_MODEL: mistral-ocr-latest

    steps:
      - name: Validate branch and secret
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${AVALAI_API_KEY:-}"

      - name: Check out current V4 implementation
        uses: actions/checkout@v4
        with:
          ref: feat/exam-prep-v4-source-aware
          path: code
          fetch-depth: 1

      - name: Check out only the selected private fixture
        uses: actions/checkout@v4
        with:
          ref: main
          path: fixtures
          fetch-depth: 1
          sparse-checkout: |
            دفترچه اول (زیست).pdf
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r code/backend/requirements.txt

      - name: Render exactly physical pages 5 and 12
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${PRIVATE_DIR}"
          python - <<'PY'
          import os
          from pathlib import Path
          import pypdfium2 as pdfium

          private_dir = Path(os.environ['PRIVATE_DIR'])
          source_path = Path(os.environ['SOURCE_PDF_PATH'])
          if not source_path.is_file():
              raise SystemExit('source fixture is unavailable')
          with source_path.open('rb') as handle:
              if handle.read(5) != b'%PDF-':
                  raise SystemExit('source fixture is not a PDF')

          expected_page_count = int(os.environ['EXPECTED_PAGE_COUNT'])
          selected = (
              ('question-page', int(os.environ['QUESTION_PAGE_NUMBER'])),
              ('answer-page', int(os.environ['ANSWER_PAGE_NUMBER'])),
          )
          document = pdfium.PdfDocument(str(source_path))
          try:
              if len(document) != expected_page_count:
                  raise SystemExit('source fixture page count mismatch')
              rendered_paths = []
              for label, page_number in selected:
                  page = document[page_number - 1]
                  try:
                      image = page.render(scale=2.0).to_pil().convert('RGB')
                  finally:
                      page.close()
                  image.thumbnail((1800, 2400))
                  output_path = private_dir / f'{label}.png'
                  image.save(output_path, format='PNG', optimize=True)
                  size = output_path.stat().st_size
                  if not 1 <= size <= 12 * 1024 * 1024:
                      raise SystemExit('rendered page violates byte bounds')
                  rendered_paths.append(output_path)
              if rendered_paths[0].read_bytes() == rendered_paths[1].read_bytes():
                  raise SystemExit('selected smoke pages must be distinct')
              (private_dir / 'question-path.txt').write_text(
                  str(rendered_paths[0]), encoding='utf-8'
              )
              (private_dir / 'answer-path.txt').write_text(
                  str(rendered_paths[1]), encoding='utf-8'
              )
          finally:
              document.close()
          PY

      - name: Run exactly eight live OCR requests
        id: live_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          QUESTION_PATH="$(cat "${PRIVATE_DIR}/question-path.txt")"
          ANSWER_PATH="$(cat "${PRIVATE_DIR}/answer-path.txt")"
          python code/backend/manage.py smoke_exam_prep_v4_avalai_ocr \
            --question-page "${QUESTION_PATH}" \
            --answer-page "${ANSWER_PATH}" \
            --report "${REPORT_PATH}" \
            --mode live_provider \
            --model "${OCR_MODEL}" \
            --smoke-modes markdown,blocks,document_annotation,bbox_annotation \
            --max-requests 8 \
            --allow-private-transmission

      - name: Validate and print sanitized aggregate summary
        id: aggregate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ['REPORT_PATH'])
          if not report_path.is_file():
              raise SystemExit('aggregate report was not created')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          assert report['plannedRequestCount'] == 8
          assert report['executedRequestCount'] == 8
          assert report['maxRequests'] == 8
          assert len(report['results']) == 8
          summary = {
              'modelRequested': report.get('model'),
              'totalLatencyMs': report.get('totalLatencyMs'),
              'totals': report.get('totals'),
              'acceptance': report.get('acceptance'),
              'results': [
                  {
                      'fixtureId': item.get('fixtureId'),
                      'mode': item.get('mode'),
                      'status': item.get('status'),
                      'errorCode': item.get('errorCode'),
                      'model': item.get('model'),
                      'returnedPageCount': item.get('returnedPageCount'),
                      'blockCount': item.get('blockCount'),
                      'bboxCount': item.get('bboxCount'),
                      'documentAnnotationPresent': item.get('documentAnnotationPresent'),
                      'issueCodes': item.get('issueCodes'),
                      'latencyMs': item.get('latencyMs'),
                  }
                  for item in report['results']
              ],
          }
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(
                  'passed=' + str(bool(report['acceptance']['passed'])).lower() + '\n'
              )
          PY

      - name: Upload aggregate report on pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-prep-v4-avalai-ocr-aggregate
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Enforce smoke acceptance after evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.aggregate.outputs.passed }}" = "true"
          test "${{ steps.live_smoke.outcome }}" = "success"

      - name: Delete private PDF checkout, page images, and local report
        if: always()
        shell: bash
        run: |
          set +e
          find "${PRIVATE_DIR}" -type f -exec shred -u {} \; 2>/dev/null
          rm -rf "${PRIVATE_DIR}"
          rm -rf "${GITHUB_WORKSPACE}/fixtures"
