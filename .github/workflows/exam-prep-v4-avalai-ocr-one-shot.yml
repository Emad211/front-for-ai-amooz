name: exam-prep-v4-avalai-ocr-one-shot

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type I_APPROVE_8_PRIVATE_OCR_REQUESTS'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: exam-prep-v4-avalai-ocr-one-shot
  cancel-in-progress: false

jobs:
  live-ocr-smoke:
    if: inputs.confirmation == 'I_APPROVE_8_PRIVATE_OCR_REQUESTS'
    name: authorized one-shot AvalAI OCR smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
      PRIVATE_DIR: ${{ runner.temp }}/exam-prep-v4-ocr-smoke
      REPORT_PATH: ${{ runner.temp }}/exam-prep-v4-ocr-smoke/aggregate-report.json
      SOURCE_PDF_PATH: ${{ github.workspace }}/fixtures/دفترچه اول (زیست).pdf
      EXPECTED_PAGE_COUNT: '16'
      QUESTION_PAGE_NUMBER: '5'
      ANSWER_PAGE_NUMBER: '12'

    steps:
      - name: Validate authorization and secret
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ inputs.confirmation }}" = "I_APPROVE_8_PRIVATE_OCR_REQUESTS"
          test -n "${AVALAI_API_KEY:-}"

      - name: Check out validated V4 implementation
        uses: actions/checkout@v4
        with:
          ref: feat/exam-prep-v4-source-aware
          path: code
          fetch-depth: 1

      - name: Check out only the selected private fixture from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: fixtures
          fetch-depth: 1
          sparse-checkout: |
            دفترچه اول (زیست).pdf
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r code/backend/requirements.txt

      - name: Render exactly physical pages 5 and 12
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${PRIVATE_DIR}"
          python - <<'PY'
          import os
          from pathlib import Path
          import pypdfium2 as pdfium

          private_dir = Path(os.environ['PRIVATE_DIR'])
          source_path = Path(os.environ['SOURCE_PDF_PATH'])
          if not source_path.is_file():
              raise SystemExit('source fixture is unavailable')
          with source_path.open('rb') as handle:
              if handle.read(5) != b'%PDF-':
                  raise SystemExit('source fixture is not a PDF')

          expected_page_count = int(os.environ['EXPECTED_PAGE_COUNT'])
          selected = (
              ('question-page', int(os.environ['QUESTION_PAGE_NUMBER'])),
              ('answer-page', int(os.environ['ANSWER_PAGE_NUMBER'])),
          )
          document = pdfium.PdfDocument(str(source_path))
          try:
              if len(document) != expected_page_count:
                  raise SystemExit('source fixture page count mismatch')
              rendered_paths = []
              for label, page_number in selected:
                  page = document[page_number - 1]
                  try:
                      image = page.render(scale=2.0).to_pil().convert('RGB')
                  finally:
                      page.close()
                  image.thumbnail((1800, 2400))
                  output_path = private_dir / f'{label}.png'
                  image.save(output_path, format='PNG', optimize=True)
                  size = output_path.stat().st_size
                  if not 1 <= size <= 12 * 1024 * 1024:
                      raise SystemExit('rendered page violates byte bounds')
                  rendered_paths.append(output_path)
              if rendered_paths[0].read_bytes() == rendered_paths[1].read_bytes():
                  raise SystemExit('selected smoke pages must be distinct')
              (private_dir / 'question-path.txt').write_text(
                  str(rendered_paths[0]), encoding='utf-8'
              )
              (private_dir / 'answer-path.txt').write_text(
                  str(rendered_paths[1]), encoding='utf-8'
              )
          finally:
              document.close()
          PY

      - name: Run exactly eight live OCR requests
        id: live_smoke
        shell: bash
        run: |
          set -euo pipefail
          QUESTION_PATH="$(cat "${PRIVATE_DIR}/question-path.txt")"
          ANSWER_PATH="$(cat "${PRIVATE_DIR}/answer-path.txt")"
          python code/backend/manage.py smoke_exam_prep_v4_avalai_ocr \
            --question-page "${QUESTION_PATH}" \
            --answer-page "${ANSWER_PATH}" \
            --report "${REPORT_PATH}" \
            --mode live_provider \
            --model mistral-ocr-4-0 \
            --smoke-modes markdown,blocks,document_annotation,bbox_annotation \
            --max-requests 8 \
            --allow-private-transmission

      - name: Validate aggregate report
        id: validate_report
        if: steps.live_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['REPORT_PATH']).read_text(encoding='utf-8'))
          assert report['model'] == 'mistral-ocr-4-0'
          assert report['plannedRequestCount'] == 8
          assert report['executedRequestCount'] == 8
          assert report['maxRequests'] == 8
          assert report['acceptance']['passed'] is True
          assert len(report['results']) == 8
          PY

      - name: Upload aggregate-only report for one day
        if: steps.validate_report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: exam-prep-v4-avalai-ocr-aggregate
          path: ${{ runner.temp }}/exam-prep-v4-ocr-smoke/aggregate-report.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Post sanitized aggregate result to Draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.live_smoke.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_report.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests

          report_path = Path(os.environ['REPORT_PATH'])
          payload = {
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'smokeOutcome': os.environ.get('SMOKE_OUTCOME') or 'not_run',
              'validationOutcome': os.environ.get('VALIDATION_OUTCOME') or 'not_run',
          }
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              payload.update({
                  'mode': report.get('mode'),
                  'model': report.get('model'),
                  'plannedRequestCount': report.get('plannedRequestCount'),
                  'executedRequestCount': report.get('executedRequestCount'),
                  'totalLatencyMs': report.get('totalLatencyMs'),
                  'totals': report.get('totals'),
                  'acceptance': report.get('acceptance'),
                  'results': [
                      {
                          key: value
                          for key, value in item.items()
                          if key not in {'requestId', 'inputBytes'}
                      }
                      for item in report.get('results', [])
                  ],
              })
          body = (
              '<!-- exam-prep-v4-avalai-ocr-one-shot -->\n'
              '## AvalAI OCR live smoke — aggregate-only result\n\n'
              '```json\n'
              + json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True)
              + '\n```'
          )
          response = requests.post(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/4/comments",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              json={'body': body},
              timeout=30,
          )
          response.raise_for_status()
          PY

      - name: Delete private PDF checkout, page images, and local report
        if: always()
        shell: bash
        run: |
          set +e
          find "${PRIVATE_DIR}" -type f -exec shred -u {} \; 2>/dev/null
          rm -rf "${PRIVATE_DIR}"
          rm -rf "${GITHUB_WORKSPACE}/fixtures"
