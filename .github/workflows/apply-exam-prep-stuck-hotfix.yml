name: apply-exam-prep-stuck-hotfix

on:
  push:
    branches:
      - hotfix/exam-prep-stuck-start

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/exam-prep-stuck-start
          fetch-depth: 0

      - name: Apply source-aware intake hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # Frontend upload transport: bounded server wait + AbortSignal.
          # -----------------------------------------------------------------
          service_path = Path('frontend/src/services/classes-service.ts')
          service = service_path.read_text(encoding='utf-8')

          upload_fn = r'''function uploadWithProgress(
            url: string,
            formData: FormData,
            token: string,
            options?: {
              onProgress?: (p: UploadProgress) => void;
              signal?: AbortSignal;
              processingTimeoutMs?: number;
            },
          ): Promise<{ status: number; body: unknown }> {
            return new Promise((resolve, reject) => {
              const xhr = new XMLHttpRequest();
              let settled = false;
              let processingTimer: number | null = null;
              const signal = options?.signal;

              const cleanup = () => {
                if (processingTimer !== null) {
                  window.clearTimeout(processingTimer);
                  processingTimer = null;
                }
                signal?.removeEventListener('abort', abortFromSignal);
              };

              const resolveOnce = (value: { status: number; body: unknown }) => {
                if (settled) return;
                settled = true;
                cleanup();
                resolve(value);
              };

              const rejectOnce = (error: Error) => {
                if (settled) return;
                settled = true;
                cleanup();
                reject(error);
              };

              const abortFromSignal = () => {
                rejectOnce(new DOMException('درخواست شروع پردازش لغو شد.', 'AbortError'));
                try {
                  xhr.abort();
                } catch {
                  // The request may already be closed.
                }
              };

              if (signal?.aborted) {
                reject(new DOMException('درخواست شروع پردازش لغو شد.', 'AbortError'));
                return;
              }

              xhr.open('POST', url, true);
              xhr.setRequestHeader('Authorization', `Bearer ${token}`);
              signal?.addEventListener('abort', abortFromSignal, { once: true });

              xhr.upload.addEventListener('progress', (event) => {
                const percent = event.lengthComputable
                  ? Math.round((event.loaded / event.total) * 100)
                  : -1;
                options?.onProgress?.({
                  percent,
                  loaded: event.loaded,
                  total: event.total,
                  phase: 'uploading',
                });
              });

              xhr.upload.addEventListener('load', () => {
                options?.onProgress?.({
                  percent: 100,
                  loaded: 0,
                  total: 0,
                  phase: 'processing',
                });
                const processingTimeoutMs = Math.max(
                  0,
                  options?.processingTimeoutMs ?? 180_000,
                );
                if (processingTimeoutMs > 0) {
                  processingTimer = window.setTimeout(() => {
                    rejectOnce(
                      new Error(
                        'فایل ارسال شد، اما سرور در زمان مجاز پاسخ نداد. درخواست آزاد شد؛ با همان فایل دوباره تلاش کنید.',
                      ),
                    );
                    try {
                      xhr.abort();
                    } catch {
                      // The request may already be closed.
                    }
                  }, processingTimeoutMs);
                }
              });

              xhr.addEventListener('load', () => {
                let body: unknown;
                try {
                  body = JSON.parse(xhr.responseText);
                } catch {
                  body = xhr.responseText;
                }
                resolveOnce({ status: xhr.status, body });
              });

              xhr.addEventListener('error', () => {
                rejectOnce(
                  new Error(
                    `ارتباط با سرور برقرار نشد. (آدرس فعلی API: ${RAW_API_URL})` +
                      ' معمولاً یکی از این‌هاست: بک‌اند اجرا نیست، آدرس/پورت اشتباه است، یا مرورگر به خاطر CORS/Mixed Content درخواست را بلاک کرده.',
                  ),
                );
              });

              xhr.addEventListener('timeout', () => {
                rejectOnce(new Error('درخواست آپلود به علت طولانی بودن زمان ارسال منقضی شد.'));
              });

              xhr.addEventListener('abort', () => {
                rejectOnce(new DOMException('درخواست شروع پردازش لغو شد.', 'AbortError'));
              });

              // Uploading a large source may legitimately take time. The shorter
              // post-upload timeout above covers the server response phase.
              xhr.timeout = 30 * 60 * 1000;
              xhr.send(formData);
            });
          }
          '''

          pattern = re.compile(
              r"function uploadWithProgress\(.*?\n\}\n\nexport async function transcribeClassCreationStep1\(",
              re.S,
          )
          match = pattern.search(service)
          if not match:
              raise SystemExit('uploadWithProgress function not found')
          service = service[:match.start()] + upload_fn + '\nexport async function transcribeClassCreationStep1(' + service[match.end():]

          old_options = "  options?: { onProgress?: (p: UploadProgress) => void },"
          if service.count(old_options) != 2:
              raise SystemExit(f'expected two step-1 option signatures, found {service.count(old_options)}')
          new_options = """  options?: {
            onProgress?: (p: UploadProgress) => void;
            signal?: AbortSignal;
            processingTimeoutMs?: number;
          },"""
          service = service.replace(old_options, new_options)

          old_call = """    token,
            options?.onProgress,
          );"""
          if service.count(old_call) != 2:
              raise SystemExit(f'expected two uploadWithProgress calls, found {service.count(old_call)}')
          service = service.replace(
              old_call,
              """    token,
            options,
          );""",
          )
          service_path.write_text(service, encoding='utf-8')

          # -----------------------------------------------------------------
          # Existing create page: wire workspace, abort and cancel while start
          # request is still waiting for its first response.
          # -----------------------------------------------------------------
          page_path = Path('frontend/src/components/teacher/create-class/create-class-page.tsx')
          page = page_path.read_text(encoding='utf-8')

          page = replace_once(
              page,
              "import { PipelineTracker } from './pipeline-tracker';",
              "import { PipelineTracker } from './pipeline-tracker';\nimport { ExamPrepSourceAwareWorkspace } from './exam-prep-source-aware-workspace';",
              'workspace import',
          )
          page = replace_once(
              page,
              """  const pollFailures = useRef<number>(0);
            const pipelineSectionRef = useRef<HTMLDivElement | null>(null);""",
              """  const pollFailures = useRef<number>(0);
            const pipelineSectionRef = useRef<HTMLDivElement | null>(null);
            const examPrepStartAbortRef = useRef<AbortController | null>(null);""",
              'abort ref',
          )
          page = replace_once(
              page,
              "    return () => stopPolling();",
              """    return () => {
                  stopPolling();
                  examPrepStartAbortRef.current?.abort();
                  examPrepStartAbortRef.current = null;
                };""",
              'effect cleanup',
          )
          page = replace_once(
              page,
              """  const startNewDraft = () => {
            stopPolling();
            pollFailures.current = 0;""",
              """  const startNewDraft = () => {
            stopPolling();
            examPrepStartAbortRef.current?.abort();
            examPrepStartAbortRef.current = null;
            pollFailures.current = 0;""",
              'new draft abort',
          )
          page = replace_once(
              page,
              """  const isExamPrepPipelineRunning = Boolean(examPrepStatus && EXAM_PREP_PROCESSING_STATUSES.has(examPrepStatus));
            const canStartExamPrepPipeline = Boolean(title.trim()) && Boolean(lessonFile) && !isExamPrepPipelineStarting && !isExamPrepPipelineRunning;""",
              """  const isExamPrepPipelineRunning = Boolean(examPrepStatus && EXAM_PREP_PROCESSING_STATUSES.has(examPrepStatus));
            const isExamPrepPdf = Boolean(
              lessonFile
              && (
                lessonFile.type === 'application/pdf'
                || lessonFile.name.toLowerCase().endsWith('.pdf')
              )
            );
            const canStartExamPrepPipeline = Boolean(title.trim()) && isExamPrepPdf && !isExamPrepPipelineStarting && !isExamPrepPipelineRunning;""",
              'pdf start guard',
          )
          page = replace_once(
              page,
              """  // A running pipeline with a known session id is the only thing we can revoke.
            const canCancelPipeline = currentIsPipelineRunning && Boolean(currentSessionId);""",
              """  // The initial request is abortable even before the server returns a session id.
            const canCancelPipeline = currentIsPipelineStarting
              || (currentIsPipelineRunning && Boolean(currentSessionId));""",
              'cancel computed state',
          )

          exam_start = page.index("    } else {\n      // Exam Prep Pipeline")
          exam_end = page.index("\n    }\n  };\n\n  const cancelPipeline", exam_start)
          exam_block = page[exam_start:exam_end]
          exam_block = replace_once(
              exam_block,
              """      setExamPrepSessionDetail(null);
              setActiveExamPrepSessionId(null);

              try {""",
              """      setExamPrepSessionDetail(null);
              setActiveExamPrepSessionId(null);

              examPrepStartAbortRef.current?.abort();
              const startController = new AbortController();
              examPrepStartAbortRef.current = startController;

              try {""",
              'exam start controller',
          )
          exam_block = replace_once(
              exam_block,
              "{ onProgress: (p) => setUploadProgress(p) },",
              """{
                    onProgress: (p) => setUploadProgress(p),
                    signal: startController.signal,
                    processingTimeoutMs: 180_000,
                  },""",
              'exam upload options',
          )
          exam_block = replace_once(
              exam_block,
              """      } catch (error) {
                const msg = error instanceof Error ? error.message : 'خطا در ارتباط با سرور';
                setExamPrepPipelineError(msg);
                setUploadProgress(null);
              } finally {
                setIsExamPrepPipelineStarting(false);
              }""",
              """      } catch (error) {
                if (startController.signal.aborted) {
                  setExamPrepPipelineError(null);
                } else {
                  const msg = error instanceof Error ? error.message : 'خطا در ارتباط با سرور';
                  setExamPrepPipelineError(msg);
                }
                setUploadProgress(null);
              } finally {
                if (examPrepStartAbortRef.current === startController) {
                  examPrepStartAbortRef.current = null;
                }
                setIsExamPrepPipelineStarting(false);
              }""",
              'exam catch finally',
          )
          page = page[:exam_start] + exam_block + page[exam_end:]

          page = replace_once(
              page,
              """  const cancelPipeline = async () => {
            // Guard: nothing running, or no session id to revoke.
            if (!canCancelPipeline) return;
            setIsCancelling(true);""",
              """  const cancelPipeline = async () => {
            if (!canCancelPipeline) return;
            if (
              pipelineType === 'exam_prep'
              && isExamPrepPipelineStarting
              && !examPrepSessionIdForActions
            ) {
              examPrepStartAbortRef.current?.abort();
              examPrepStartAbortRef.current = null;
              setIsExamPrepPipelineStarting(false);
              setUploadProgress(null);
              setExamPrepPipelineError(null);
              setCancelDialogOpen(false);
              toast.success('درخواست شروع پردازش لغو شد.');
              return;
            }
            setIsCancelling(true);""",
              'early start cancellation',
          )

          page = replace_once(
              page,
              """              : 'برای استخراج سوالات و پاسخ‌ها از ویدیوی حل تست استفاده کنید. شامل ترنسکریپت، استخراج سوالات و دعوت دانش‌آموزان.'}""",
              """              : 'فایل PDF سؤال‌ها، پاسخ‌نامه یا راه‌حل را بارگذاری کنید. ساختار صفحات بررسی می‌شود و سپس سؤال‌ها و پاسخ‌ها آماده می‌شوند.'}""",
              'exam helper copy',
          )
          page = replace_once(
              page,
              "title={pipelineType === 'class' ? 'بارگذاری فایل درسی' : 'بارگذاری فایل حل تست'}",
              "title={pipelineType === 'class' ? 'بارگذاری فایل درسی' : 'بارگذاری فایل آزمون'}",
              'upload title',
          )
          page = replace_once(
              page,
              '          accept="audio/*,video/*,image/*,application/pdf,.pdf"',
              "          accept={pipelineType === 'class' ? 'audio/*,video/*,image/*,application/pdf,.pdf' : 'application/pdf,.pdf'}",
              'upload accept',
          )
          page = replace_once(
              page,
              """                {lessonFile ? `فایل انتخاب‌شده: ${lessonFile.name}` : 'یک فایل صوتی، ویدیویی، تصویری یا PDF انتخاب کنید.'}""",
              """                {lessonFile
                  ? `فایل انتخاب‌شده: ${lessonFile.name}`
                  : pipelineType === 'class'
                    ? 'یک فایل صوتی، ویدیویی، تصویری یا PDF انتخاب کنید.'
                    : 'یک فایل PDF سؤال‌ها، پاسخ‌نامه یا راه‌حل انتخاب کنید.'}""",
              'selected file copy',
          )
          page = replace_once(
              page,
              """        </FileUploadSection>
              </div>

              {pipelineType === 'class' ? (""",
              """        </FileUploadSection>
              </div>

              {pipelineType === 'exam_prep' && examPrepSessionIdForActions ? (
                <ExamPrepSourceAwareWorkspace sessionId={examPrepSessionIdForActions} />
              ) : null}

              {pipelineType === 'class' ? (""",
              'embedded source-aware workspace',
          )
          page_path.write_text(page, encoding='utf-8')

          # -----------------------------------------------------------------
          # Backend intake: bounded dispatch behavior and safe stage logging.
          # -----------------------------------------------------------------
          compat_path = Path('backend/apps/classes/views_v4_compat.py')
          compat = compat_path.read_text(encoding='utf-8')
          compat = replace_once(
              compat,
              """from __future__ import annotations

          import uuid""",
              """from __future__ import annotations

          import logging
          import time
          import uuid""",
              'compat imports',
          )
          compat = replace_once(
              compat,
              "from apps.classes.tasks_v4 import dispatch_exam_prep_v4_sources\n",
              "from apps.classes.tasks_v4 import dispatch_exam_prep_v4_sources\n\n\nlogger = logging.getLogger('apps.classes.exam_prep_v4')\n",
              'compat logger',
          )
          compat = replace_once(
              compat,
              """    def post(self, request):
                if not exam_prep_v4_enabled():
                    raise Http404

                serializer = Step1TranscribeRequestSerializer(data=request.data)""",
              """    def post(self, request):
                if not exam_prep_v4_enabled():
                    raise Http404

                started_at = time.monotonic()
                serializer = Step1TranscribeRequestSerializer(data=request.data)""",
              'compat start timer',
          )
          compat = replace_once(
              compat,
              """        try:
                    uploaded = persist_uploaded_pdf_batch(
                        teacher=request.user,
                        uploads=[uploaded_file],
                        metadata=metadata,
                        organization=scope.organization,
                        study_group=scope.study_group,
                    )[0]""",
              """        persist_started_at = time.monotonic()
                logger.info(
                    'exam_prep_v4.intake.persist_started userId=%s byteSize=%s',
                    request.user.id,
                    max(0, int(getattr(uploaded_file, 'size', 0) or 0)),
                )
                try:
                    uploaded = persist_uploaded_pdf_batch(
                        teacher=request.user,
                        uploads=[uploaded_file],
                        metadata=metadata,
                        organization=scope.organization,
                        study_group=scope.study_group,
                    )[0]
                    logger.info(
                        'exam_prep_v4.intake.persist_completed userId=%s projectId=%s documentId=%s elapsedMs=%s',
                        request.user.id,
                        uploaded.project_id,
                        uploaded.document_id,
                        round((time.monotonic() - persist_started_at) * 1000, 2),
                    )""",
              'persist logging',
          )
          compat = replace_once(
              compat,
              """        if not uploaded.classification_already_available:
                    task_id = dispatch_exam_prep_v4_sources([uploaded.document_id])
                    ClassCreationSession.objects.filter(id=session.id).update(
                        celery_task_id=str(task_id)[:255],
                    )

                session = sync_create_flow_session(project) or session
                return Response(
                    Step1TranscribeResponseSerializer(session).data,
                    status=status.HTTP_202_ACCEPTED,
                )""",
              """        if not uploaded.classification_already_available:
                    dispatch_started_at = time.monotonic()
                    logger.info(
                        'exam_prep_v4.intake.dispatch_started projectId=%s documentId=%s sessionId=%s',
                        project.id,
                        uploaded.document_id,
                        session.id,
                    )
                    try:
                        task_id = dispatch_exam_prep_v4_sources([uploaded.document_id])
                    except Exception:
                        logger.exception(
                            'exam_prep_v4.intake.dispatch_failed projectId=%s documentId=%s sessionId=%s elapsedMs=%s',
                            project.id,
                            uploaded.document_id,
                            session.id,
                            round((time.monotonic() - dispatch_started_at) * 1000, 2),
                        )
                        ExamProject.objects.filter(id=project.id).update(
                            status=ExamProject.Status.FAILED,
                            error_code='source_dispatch_failed',
                            error_detail='Source preparation task could not be queued.',
                            workflow_state={
                                'stage': 'failed',
                                'message': 'ارسال پردازش به صف انجام نشد. دوباره تلاش کنید.',
                                'progressPercent': 0,
                            },
                        )
                        ClassCreationSession.objects.filter(id=session.id).update(
                            status=ClassCreationSession.Status.FAILED,
                            error_detail='ارسال پردازش به صف انجام نشد. دوباره تلاش کنید.',
                            workflow_state={
                                'stage': 'failed',
                                'message': 'ارسال پردازش به صف انجام نشد. دوباره تلاش کنید.',
                                'progressPercent': 0,
                                'warnings': [],
                                'readyForReview': False,
                                'sourceAwareProjectId': project.id,
                            },
                        )
                        return Response(
                            {
                                'code': 'source_dispatch_failed',
                                'detail': 'فایل ذخیره شد، اما ارسال پردازش به صف انجام نشد. دوباره تلاش کنید.',
                                'sessionId': session.id,
                            },
                            status=status.HTTP_503_SERVICE_UNAVAILABLE,
                        )
                    ClassCreationSession.objects.filter(id=session.id).update(
                        celery_task_id=str(task_id)[:255],
                    )
                    logger.info(
                        'exam_prep_v4.intake.dispatch_completed projectId=%s documentId=%s sessionId=%s elapsedMs=%s',
                        project.id,
                        uploaded.document_id,
                        session.id,
                        round((time.monotonic() - dispatch_started_at) * 1000, 2),
                    )

                session = sync_create_flow_session(project) or session
                logger.info(
                    'exam_prep_v4.intake.response_ready projectId=%s documentId=%s sessionId=%s elapsedMs=%s',
                    project.id,
                    uploaded.document_id,
                    session.id,
                    round((time.monotonic() - started_at) * 1000, 2),
                )
                return Response(
                    Step1TranscribeResponseSerializer(session).data,
                    status=status.HTTP_202_ACCEPTED,
                )""",
              'bounded dispatch block',
          )
          compat_path.write_text(compat, encoding='utf-8')

          tasks_path = Path('backend/apps/classes/tasks_v4.py')
          tasks = tasks_path.read_text(encoding='utf-8')
          tasks = replace_once(
              tasks,
              """    result = group(
                    process_exam_prep_v4_source.s(document_id)
                    for document_id in ids
                ).apply_async()
                return str(result.id)""",
              """    signatures = [
                    process_exam_prep_v4_source.s(document_id).set(queue='pipeline')
                    for document_id in ids
                ]
                result = group(signatures).apply_async(retry=False)
                return str(result.id)""",
              'explicit source queue dispatch',
          )
          tasks_path.write_text(tasks, encoding='utf-8')

          test_path = Path('backend/apps/classes/test_exam_prep_v4_create_flow_bridge.py')
          tests = test_path.read_text(encoding='utf-8')
          test_case = r'''

          def test_step1_dispatch_failure_returns_retryable_error_and_unlocks_session(
              private_storage,
              monkeypatch,
              settings,
          ):
              settings.EXAM_PREP_V4_ENABLED = True
              teacher = _teacher()

              def fail_dispatch(_document_ids):
                  raise RuntimeError('broker unavailable')

              monkeypatch.setattr(
                  'apps.classes.views_v4_compat.dispatch_exam_prep_v4_sources',
                  fail_dispatch,
              )

              response = _auth(teacher).post(
                  STEP1_URL,
                  {
                      'title': 'آزمون خطای صف',
                      'file': _upload(),
                      'client_request_id': str(uuid.uuid4()),
                  },
                  format='multipart',
              )

              assert response.status_code == 503
              assert response.data['code'] == 'source_dispatch_failed'
              session = ClassCreationSession.objects.get(id=response.data['sessionId'])
              project = ExamProject.objects.get(teacher=teacher)
              assert session.status == ClassCreationSession.Status.FAILED
              assert project.status == ExamProject.Status.FAILED
              assert project.error_code == 'source_dispatch_failed'
          '''
          if 'test_step1_dispatch_failure_returns_retryable_error_and_unlocks_session' not in tests:
              tests += test_case
          test_path.write_text(tests, encoding='utf-8')

          workflow = Path('.github/workflows/apply-exam-prep-stuck-hotfix.yml')
          workflow.unlink()
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(exam-prep): unlock stuck intake and expose PDF review"
          git push origin HEAD:hotfix/exam-prep-stuck-start
