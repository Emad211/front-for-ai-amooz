name: apply-exam-prep-stuck-hotfix-pr

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/exam-prep-stuck-start' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/exam-prep-stuck-start
          fetch-depth: 0

      - name: Apply hotfix
        run: python .github/scripts/apply_exam_prep_stuck_hotfix.py

      - name: Commit generated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(exam-prep): unlock stuck intake and expose PDF review"
          git push origin HEAD:hotfix/exam-prep-stuck-start
