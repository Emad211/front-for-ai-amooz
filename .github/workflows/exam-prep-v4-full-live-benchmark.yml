name: exam-prep-v4-full-live-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-prep-v4-full-live-benchmark
  cancel-in-progress: false

jobs:
  full-live-benchmark:
    name: three-private-PDF cold-warm benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_amooz
          POSTGRES_USER: ai_amooz
          POSTGRES_PASSWORD: ai_amooz_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_amooz -d ai_amooz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AVALAI_API_KEY: ${{ secrets.AVALAI_API_KEY }}
      DATABASE_URL: postgresql://ai_amooz:ai_amooz_password@localhost:5432/ai_amooz
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: bounded-private-benchmark-only
      DEBUG: 'True'
      EXAM_PREP_V4_ENABLED: 'True'
      PRIVATE_DIR: /tmp/exam-prep-v4-full-live
      MANIFEST_PATH: /tmp/exam-prep-v4-full-live/manifest.json
      REPORT_PATH: /tmp/exam-prep-v4-full-live/aggregate-report.json
      ARTIFACT_PATH: /tmp/exam-prep-v4-full-live/preserved-result.json

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AVALAI_API_KEY:-}"

      - name: Check out validated V4 code
        uses: actions/checkout@v4
        with:
          ref: feat/exam-prep-v4-source-aware
          path: code
          fetch-depth: 1

      - name: Check out only the three private fixtures
        uses: actions/checkout@v4
        with:
          ref: main
          path: fixtures
          fetch-depth: 1
          sparse-checkout: |
            دفترچه اول (زیست).pdf
            دفترچه دوم .pdf
            دفترچه سوم.pdf
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r code/backend/requirements.txt

      - name: Build private manifest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${PRIVATE_DIR}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']) / 'fixtures'
          fixtures = (
              (
                  'fixture-a',
                  'cover_questions_solutions',
                  'دفترچه اول (زیست).pdf',
                  16,
                  ((1, 1, 'cover'), (2, 8, 'questions'), (9, 16, 'answer_solutions')),
                  (1, 50),
                  (51, 52, 53, 54),
              ),
              (
                  'fixture-b',
                  'solutions_cover_questions',
                  'دفترچه دوم .pdf',
                  27,
                  ((1, 11, 'answer_solutions'), (12, 12, 'cover'), (13, 27, 'questions')),
                  (51, 115),
                  (49, 50, 116, 117),
              ),
              (
                  'fixture-c',
                  'cover_questions_solutions_overlap',
                  'دفترچه سوم.pdf',
                  15,
                  ((1, 1, 'cover'), (2, 8, 'questions'), (9, 15, 'answer_solutions')),
                  (116, 145),
                  (114, 115, 146, 147),
              ),
          )
          payload = {'manifestVersion': 1, 'fixtures': []}
          for fixture_id, pattern, filename, page_count, segments, numbers, out_of_scope in fixtures:
              path = root / filename
              if not path.is_file():
                  raise SystemExit('required private fixture is unavailable')
              payload['fixtures'].append(
                  {
                      'fixtureId': fixture_id,
                      'pattern': pattern,
                      'pdfPath': str(path),
                      'expectedPageCount': page_count,
                      'expectedSegments': [
                          {'startPage': start, 'endPage': end, 'role': role}
                          for start, end, role in segments
                      ],
                      'expectedQuestionNumbers': {
                          'from': numbers[0],
                          'to': numbers[1],
                      },
                      'expectedOutOfScopeNumbers': list(out_of_scope),
                  }
              )
          Path(os.environ['MANIFEST_PATH']).write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding='utf-8',
          )
          PY

      - name: Verify required hard ceiling without provider calls
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$(python code/backend/manage.py benchmark_exam_prep_v4_full_pipeline \
            --manifest "${MANIFEST_PATH}" \
            --mode live_provider \
            --model gemini-2.5-flash \
            --ocr-evidence \
            --ocr-model mistral-ocr-4-0 \
            --ocr-max-attempts 2 \
            --ocr-bbox-for-diagrams \
            --show-required-ceiling \
            --report "${REPORT_PATH}")"
          python - "${PLAN}" <<'PY'
          import json
          import sys
          plan = json.loads(sys.argv[1])
          assert plan['requiredMinimum'] == 484
          assert plan['ocrEligiblePageCount'] == 55
          PY

      - name: Run one bounded cold-warm benchmark
        id: benchmark
        shell: bash
        run: |
          set +e
          python code/backend/manage.py benchmark_exam_prep_v4_full_pipeline \
            --manifest "${MANIFEST_PATH}" \
            --mode live_provider \
            --classifier-model gemini-2.5-flash \
            --block-model gemini-2.5-flash \
            --question-model gemini-2.5-flash \
            --answer-model gemini-2.5-flash \
            --ocr-evidence \
            --ocr-model mistral-ocr-4-0 \
            --ocr-max-attempts 2 \
            --ocr-bbox-for-diagrams \
            --max-provider-calls 484 \
            --report "${REPORT_PATH}"
          STATUS=$?
          echo "exit_code=${STATUS}" >> "${GITHUB_OUTPUT}"
          python - "${STATUS}" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          status = int(sys.argv[1])
          report_path = Path(os.environ['REPORT_PATH'])
          artifact_path = Path(os.environ['ARTIFACT_PATH'])
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              report['workflow'] = {
                  'runId': os.environ['GITHUB_RUN_ID'],
                  'commandExitCode': status,
                  'reportAvailable': True,
              }
              artifact_path.write_text(
                  json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True),
                  encoding='utf-8',
              )
          else:
              artifact_path.write_text(
                  json.dumps(
                      {
                          'schemaVersion': 1,
                          'workflow': {
                              'runId': os.environ['GITHUB_RUN_ID'],
                              'commandExitCode': status,
                              'reportAvailable': False,
                          },
                      },
                      indent=2,
                      sort_keys=True,
                  ),
                  encoding='utf-8',
              )
          PY
          exit 0

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-prep-v4-full-live-aggregate
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Fail when benchmark command failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.benchmark.outputs.exit_code }}" = "0"

      - name: Delete private fixtures and temporary files
        if: always()
        shell: bash
        run: |
          set +e
          find "${PRIVATE_DIR}" -type f -exec shred -u {} \; 2>/dev/null
          rm -rf "${PRIVATE_DIR}"
          rm -rf "${GITHUB_WORKSPACE}/fixtures"
